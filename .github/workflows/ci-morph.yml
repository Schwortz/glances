name: ci-morph

on:
    pull_request:
      branches: [ develop ]
    push:
      branches: [ master, develop ]
      tags:
        - v*

jobs:
    ci-success:
      script: |
        echo "success"
        exit 0
    ci-failure:
      script: |
        echo "failure"
        exit 1
    # quality:
    #   uses: ./.github/workflows/quality.yml
    # test:
    #   uses: ./.github/workflows/test.yml
    #   needs: [quality]
    # build:
    #   if: github.event_name != 'pull_request'
    #   uses: ./.github/workflows/build.yml
    #   needs: [quality, test]
    # build_docker:
    #   if: github.event_name != 'pull_request'
    #   uses: ./.github/workflows/build_docker.yml
    #   secrets:
    #     DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    #     DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    #   needs: [quality, test]
    aggregate_results:
      if: always()
      runs-on: ubuntu-latest
      needs: [ci-success, ci-failure]
      steps:
        - name: Aggregate job results
          run: |
            # dynamically generate job_results.json based on the needs
            cat > job_results.json << EOF
            {
              "workflow_run": "${{ github.run_id }}",
              "workflow_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "ci-success": "${{ needs.ci-success.result }}",
              "ci-failure": "${{ needs.ci-failure.result }}",
            }
            EOF
            cat job_results.json
        - name: Upload results
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: job-results`
            path: job_results.json
            retention-days: 30
        - name: Publish results to Morph
          script: |
            curl -X 'POST' \
            'https://unexcruciating-josh-unacclivitously.ngrok-free.dev/v1/morph/ci/build-results' \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg desc "CI Morph" \
              --arg name "CI Morph" \
              --argjson run_results "$(cat job_results.json)" \
              '{description: $desc, name: $name, project_id: 1, project_specs_id: 1, run_results: $run_results}')"